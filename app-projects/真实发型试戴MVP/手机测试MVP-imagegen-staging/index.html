<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="仅在本机处理的手机实时发型轮廓测试。" />
  <title>真实发型试戴</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body data-mode="scan" data-camera-live="false" data-comparing="false">
  <main class="tryon-app" aria-live="polite">
    <section class="camera-surface" id="cameraSurface" aria-label="相机预览">
      <img class="placeholder-photo" id="previewPlaceholder" src="assets/ui-v2/scan-placeholder-front.png" alt="示例正面照片，仅在摄像头未开启时显示" />
      <video id="camera" playsinline muted aria-label="实时摄像头预览"></video>
      <canvas id="fakeSource" width="960" height="720" hidden></canvas>
      <canvas id="hairCanvas" width="960" height="720" aria-label="实时发型轮廓叠加层"></canvas>
      <div class="camera-scrim"></div>
      <p class="local-note">仅在本机处理</p>
      <p class="model-loading" id="modelLoading" hidden>正在准备本地关键点</p>
      <p class="feedback-toast" id="feedback" role="status">准备开始扫描</p>
      <p class="out-range" id="outRange" hidden>请缓慢转回</p>
    </section>
    <section class="screen screen-scan" aria-label="头型扫描">
      <header class="topbar topbar-dark"><button class="text-control" id="exitScan" type="button">退出</button><h1>扫描头型</h1><button class="text-control" id="scanHelp" type="button">帮助</button></header>
      <div class="face-guide" aria-hidden="true"></div>
      <section class="scan-progress" aria-label="扫描进度"><ol id="calibrationList"><li data-phase="center"><span></span><b>正面</b></li><li data-phase="left"><span></span><b>向左转</b></li><li data-phase="return_center"><span></span><b>回正</b></li><li data-phase="right"><span></span><b>向右转</b></li></ol></section>
      <section class="scan-dock"><p id="phaseTitle">准备扫描</p><small id="phaseCue">请把头部放入椭圆引导内</small><div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div><button class="scan-trigger" id="startScan" type="button">开始扫描</button><button class="scan-stop" id="stopScan" type="button" disabled>停止</button><button class="scan-retry" id="retryScan" type="button" hidden>重新开始</button></section>
    </section>
    <section class="screen screen-style" aria-label="发型试戴">
      <header class="topbar topbar-light"><button class="text-control" id="backToScan" type="button">返回</button><div class="top-actions"><button class="pill-control" id="compareToggle" type="button">对比</button><button class="save-control" id="saveTop" type="button">保存</button></div></header>
      <section class="style-sheet" id="styleCard" aria-label="发型选择"><span class="sheet-handle" aria-hidden="true"></span><div class="sheet-tabs" role="tablist" aria-label="试戴选项"><button class="sheet-tab active" type="button" role="tab" aria-selected="true">发型</button><button class="sheet-tab" type="button" role="tab" aria-selected="false" disabled>颜色</button></div><p class="sheet-caption">选择适合你的轮廓</p><div class="style-options"><button class="style-option selected" data-style="short" type="button"><img src="assets/ui-v2/short-layers-demo-front.png" alt="短层次示例" /><b>短层次</b></button><button class="style-option" data-style="bob" type="button"><img src="assets/ui-v2/scan-placeholder-side.png" alt="Bob 示意" /><b>Bob</b></button></div><div class="style-actions"><button class="subtle-action" id="stopTop" type="button" disabled>停止相机</button><button class="primary-action" id="viewResult" type="button">查看对比</button></div></section>
    </section>
    <section class="screen screen-result" aria-label="试戴结果">
      <header class="topbar topbar-light"><button class="text-control" id="backToStyle" type="button">返回</button><div class="result-tabs" role="tablist" aria-label="结果角度"><button class="result-tab active" type="button" data-view="front" role="tab" aria-selected="true">正面</button><button class="result-tab" type="button" data-view="side" role="tab" aria-selected="false">侧面</button></div><button class="save-control" id="saveResult" type="button">保存</button></header>
      <div class="compare-line" aria-hidden="true"><span>对比</span></div><img class="side-thumbnail" id="sideThumbnail" src="assets/ui-v2/short-layers-demo-side.png" alt="短层次侧面示例，仅在摄像头未开启时显示" />
      <section class="result-sheet"><span class="sheet-handle" aria-hidden="true"></span><div class="result-actions"><button class="outline-action" id="reselectStyle" type="button">重新选择</button><button class="primary-action" id="saveReference" type="button">保存参考</button></div></section>
    </section>
    <p id="testBanner" hidden></p><p id="inputMode" hidden>等待摄像头</p><span id="yawValue" hidden></span><span id="rollValue" hidden></span><span id="scaleValue" hidden></span><span id="fpsValue" hidden></span><span id="phaseCount" hidden>0 / 4</span><output id="opacityValue" hidden>68%</output><input id="hairOpacity" type="range" min="35" max="90" value="68" hidden />
  </main>
  <script type="module" src="scan.js"></script>
</body>
</html>
